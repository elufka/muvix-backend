spring.application.name=muvix-backend
server.port=${SERVER_PORT:8080}

# Supabase PostgreSQL. Supply DB_PASSWORD through the environment.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DATABASE_USERNAME:postgres.rzmpcgkaybknwboqdyol}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT_SECRET must be a base64-encoded key of at least 256 bits.
muvix.security.jwt.secret=${JWT_SECRET}
muvix.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
